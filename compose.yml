services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: career_copilot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: career_copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_copilot -d career_copilot"]
      interval: 2s
      timeout: 5s
      retries: 15

  db-test:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_USER: career_copilot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: career_copilot_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_copilot -d career_copilot_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
